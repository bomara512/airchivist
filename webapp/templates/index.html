{% extends "base.html" %}
{% block title %}ViewTube — {{ stats.total_videos }} videos{% endblock %}

{% block content %}
<div class="toolbar">
  <form id="filter-form"
        hx-get="/"
        hx-target="#video-container"
        hx-push-url="true"
        hx-trigger="change from:select, keyup changed delay:300ms from:input[name=search]">

    <input name="search" value="{{ current_search or '' }}" placeholder="Search…"
           autocomplete="off">

    <select name="channel">
      <option value="">All channels</option>
      {% for ch in channels %}
      <option value="{{ ch }}" {% if ch == current_channel %}selected{% endif %}>{{ ch }}</option>
      {% endfor %}
    </select>

    {% if canonical_tags %}
    <select name="tag">
      <option value="">All tags</option>
      {% for group in canonical_tags %}
        {% if group.name %}
        <optgroup label="{{ group.name }}">
          {% for tag_name in group.tags %}
          <option value="{{ tag_name }}" {% if tag_name == current_tag %}selected{% endif %}>{{ tag_name }}</option>
          {% endfor %}
        </optgroup>
        {% else %}
        {% for tag_name in group.tags %}
        <option value="{{ tag_name }}" {% if tag_name == current_tag %}selected{% endif %}>{{ tag_name }}</option>
        {% endfor %}
        {% endif %}
      {% endfor %}
    </select>
    {% endif %}

    <select name="sort_by">
      <option value="date_added"          {% if sort_by == 'date_added'          %}selected{% endif %}>Date Added</option>
      <option value="title"               {% if sort_by == 'title'               %}selected{% endif %}>Title</option>
      <option value="yt_view_count"       {% if sort_by == 'yt_view_count'       %}selected{% endif %}>YouTube Views</option>
      <option value="personal_view_count" {% if sort_by == 'personal_view_count' %}selected{% endif %}>Times Watched</option>
      <option value="date_last_viewed"    {% if sort_by == 'date_last_viewed'    %}selected{% endif %}>Last Viewed</option>
      <option value="date_published"      {% if sort_by == 'date_published'      %}selected{% endif %}>Date Published</option>
    </select>

    <select name="sort_dir">
      <option value="desc" {% if sort_dir == 'desc' %}selected{% endif %}>Desc</option>
      <option value="asc"  {% if sort_dir == 'asc'  %}selected{% endif %}>Asc</option>
    </select>

    <select name="group">
      <option value="" {% if not group %}selected{% endif %}>No grouping</option>
      <option value="channel" {% if group == 'channel' %}selected{% endif %}>By channel</option>
      <option value="tag" {% if group == 'tag' %}selected{% endif %}>By tag</option>
    </select>

    <a href="/" class="reset-btn">Reset</a>
  </form>

</div>

<div id="video-container">
  {% include "_video_container.html" %}
</div>
{% endblock %}
