{% if related %}
<div class="tag-related">
  <span class="tag-related-label">Related to "{{ source_tag }}":</span>
  <div class="tag-related-pills">
    {% for tag in related %}
    <label class="pool-tag pool-tag-related" data-tag-name="{{ tag.name | e }}">
      <input type="checkbox" name="member" value="{{ tag.name }}" checked>
      {{ tag.name }}<span class="pool-tag-count">{{ tag.shared }}</span>
    </label>
    {% endfor %}
  </div>
</div>
{% endif %}
