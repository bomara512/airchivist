<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ViewTube{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
</head>
<body>
  <header>
    <nav>
      <a href="{{ url_for('main.index') }}">ViewTube</a>
      {% if stats is defined %}
      <span class="nav-stats">{{ stats.total_videos }} videos &middot; {{ stats.total_channels }} channels</span>
      {% endif %}
      <a href="{{ url_for('main.tags') }}" style="font-size:0.9rem;font-weight:400;">Tags</a>
      <a href="{{ url_for('main.watch_later') }}" style="font-size:0.9rem;font-weight:400;">Watch Later</a>
      {% if stats is defined and stats.hidden_count %}
      <a href="{{ url_for('main.hidden') }}" class="nav-hidden">Hidden ({{ stats.hidden_count }})</a>
      {% endif %}
      <a href="{{ url_for('main.install') }}" class="nav-install">Install bookmarklet</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Context menus (shared across all pages) -->
  <div id="tag-pill-menu" class="alias-context-menu">
    <button id="tag-pill-remove">✕ Remove from video</button>
  </div>

  <div id="video-card-menu" class="alias-context-menu">
    <button id="video-card-hide">Hide video</button>
  </div>

  <script>
  (function () {
    // Tag pill context menu
    var pillMenu = document.getElementById('tag-pill-menu');
    var activePill = null;

    function hidePillMenu() { pillMenu.style.display = 'none'; activePill = null; }

    // Video card right-click menu
    var cardMenu = document.getElementById('video-card-menu');
    var activeCard = null;

    function hideCardMenu() { cardMenu.style.display = 'none'; activeCard = null; }

    document.addEventListener('contextmenu', function (e) {
      if (e.target.closest('.tag-pill')) {
        hideCardMenu();
        var pill = e.target.closest('.tag-pill');
        e.preventDefault();
        activePill = pill;
        pillMenu.style.display = 'block';
        var x = Math.min(e.clientX, window.innerWidth - pillMenu.offsetWidth - 8);
        var y = Math.min(e.clientY, window.innerHeight - pillMenu.offsetHeight - 8);
        pillMenu.style.left = x + 'px';
        pillMenu.style.top = y + 'px';
        return;
      }
      hidePillMenu();

      var card = e.target.closest('.video-card');
      if (!card || card.closest('.hidden-videos-grid')) { hideCardMenu(); return; }
      e.preventDefault();
      activeCard = card;
      cardMenu.style.display = 'block';
      var x = Math.min(e.clientX, window.innerWidth - cardMenu.offsetWidth - 8);
      var y = Math.min(e.clientY, window.innerHeight - cardMenu.offsetHeight - 8);
      cardMenu.style.left = x + 'px';
      cardMenu.style.top = y + 'px';
    });

    document.addEventListener('click', function (e) {
      if (!pillMenu.contains(e.target)) hidePillMenu();
      if (!cardMenu.contains(e.target)) hideCardMenu();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { hidePillMenu(); hideCardMenu(); }
    });

    document.getElementById('tag-pill-remove').addEventListener('click', function () {
      if (!activePill) return;
      var tagName = activePill.dataset.tagName;
      var videoId = activePill.closest('.video-tags').dataset.videoId;
      var pill = activePill;
      hidePillMenu();
      fetch('/videos/' + videoId + '/tags/remove', {
        method: 'POST',
        body: new URLSearchParams({ tag_name: tagName })
      }).then(function (r) { if (r.ok) pill.remove(); });
    });

    document.getElementById('video-card-hide').addEventListener('click', function () {
      if (!activeCard) return;
      var videoId = activeCard.dataset.videoId;
      var card = activeCard;
      hideCardMenu();
      fetch('/videos/' + videoId + '/hide', { method: 'POST' })
        .then(function (r) { if (r.ok) card.remove(); });
    });

    // Watch Later button — add to queue (main list and shelf cards)
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.watch-later-btn');
      if (!btn || btn.disabled) return;
      var videoId = btn.dataset.videoId;
      var onShelf = !!btn.closest('#shelf-carousel');
      fetch('/api/watch-later/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: 'https://www.youtube.com/watch?v=' + videoId })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.status === 'added') {
            if (onShelf) {
              var card = btn.closest('.video-card');
              if (card) {
                card.style.opacity = '0';
                card.style.transition = 'opacity 0.2s';
                setTimeout(function () { card.remove(); }, 200);
              }
            } else {
              btn.disabled = true;
              btn.title = 'Already in Watch Later';
            }
          } else if (data.status === 'already_in_queue') {
            if (onShelf) {
              var card = btn.closest('.video-card');
              if (card) {
                card.style.opacity = '0';
                card.style.transition = 'opacity 0.2s';
                setTimeout(function () { card.remove(); }, 200);
              }
            } else {
              btn.disabled = true;
              btn.title = 'Already in Watch Later';
            }
          }
        });
    });

    // Remove from Watch Later queue button (watch-later page)
    document.addEventListener('click', function (e) {
      var btn = e.target.closest('.queue-remove-btn');
      if (!btn) return;
      var videoId = btn.dataset.videoId;
      var card = btn.closest('.video-card');
      fetch('/api/watch-later/remove', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: 'https://www.youtube.com/watch?v=' + videoId })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.status === 'removed') {
            card.style.opacity = '0.5';
            setTimeout(function () {
              card.remove();
              // Reindex position badges
              document.querySelectorAll('.queue-position-badge').forEach(function (badge, idx) {
                badge.textContent = idx + 1;
              });
              // Update header count
              var countEl = document.querySelector('.queue-count');
              if (countEl) {
                var remaining = document.querySelectorAll('.watch-later-list .video-card').length;
                countEl.textContent = remaining;
                if (remaining === 0) location.reload();
              }
            }, 200);
          }
        });
    });
  })();
  </script>
</body>
</html>
