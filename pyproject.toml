[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airchivist"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp",
    "beautifulsoup4",
    "requests",
    "google-api-python-client",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff==0.16.9",   # keep in step with .pre-commit-config.yaml's rev
    "mypy==2.3.1",    # keep in step with .pre-commit-config.yaml's mypy rev
    "pre-commit",
]

[project.scripts]
airchivist-crawler = "crawler.cli:main"
airchivist-web = "webapp.cli:main"

[tool.setuptools.packages.find]
include = ["webapp*", "crawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=crawler --cov=webapp --cov=tools --cov=scripts --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# F = pyflakes (dead imports, f-strings without placeholders)
# I = import sorting
# UP = pyupgrade (PEP 604 unions, datetime.UTC, modern generics)
# Deliberately deferred: "E"/"W" (line-length noise on existing prose-heavy
# comments), "B"/"SIM" (findings need judgment; revisit once this baseline is green).
select = ["F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["webapp", "crawler"]
# Deliberately not strict: this codebase is partially annotated, and --strict
# would produce hundreds of findings with no path to green. These three catch
# real bugs without demanding full annotation.
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

# yt-dlp publishes no stubs, and `anthropic` is an optional dependency the app
# runs fine without (`llm_tagger.is_available()` returns False). Declared here
# rather than as inline `type: ignore`s so the pre-commit hook — whose venv has
# neither installed — agrees with a local run that happens to have them.
[[tool.mypy.overrides]]
module = ["anthropic.*", "yt_dlp.*"]
ignore_missing_imports = true
