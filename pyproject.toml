[project]
name = "viewtube"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp",
    "beautifulsoup4",
    "requests",
    "google-api-python-client",
    "flask>=3.0",
]

[project.scripts]
viewtube-crawler = "crawler.cli:main"
viewtube-web = "webapp.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=crawler --cov=webapp --cov=tools --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]
