[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airchivist"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp",
    "beautifulsoup4",
    "requests",
    "google-api-python-client",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff==0.16.9",   # keep in step with .pre-commit-config.yaml's rev
    "pre-commit",
]

[project.scripts]
airchivist-crawler = "crawler.cli:main"
airchivist-web = "webapp.cli:main"

[tool.setuptools.packages.find]
include = ["webapp*", "crawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=crawler --cov=webapp --cov=tools --cov=scripts --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# F = pyflakes (dead imports, f-strings without placeholders)
# I = import sorting
# Deliberately deferred: "E"/"W" (line-length noise on existing prose-heavy
# comments), "UP" (owned by Task 13 so the typing diff is reviewable alone),
# "B"/"SIM" (findings need judgment; revisit once this baseline is green).
select = ["F", "I"]
