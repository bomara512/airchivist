[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airchivist"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp",
    "beautifulsoup4",
    "requests",
    "google-api-python-client",
    "flask>=3.0",
]

[project.scripts]
airchivist-crawler = "crawler.cli:main"
airchivist-web = "webapp.cli:main"

[tool.setuptools.packages.find]
include = ["webapp*", "crawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=crawler --cov=webapp --cov=tools --cov=scripts --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]
